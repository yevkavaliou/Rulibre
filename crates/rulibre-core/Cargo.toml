[package]
name = "rulibre-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared library for Rulibre — Calibre library scanning, metadata parsing, format conversion, and e-reader device transfer."

[lib]
path = "src/lib.rs"

[dependencies]
serde = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
roxmltree = { workspace = true }
kuchikiki = "=0.8.8-speedreader"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Devices_DeviceAndDriverInstallation"] }
windows = { version = "0.62.2", features = ["Win32_Devices_PortableDevices", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.182"

[dev-dependencies]
serde_json = { workspace = true }

[[bin]]
name = "scan_metadata"
path = "src/bin/scan_metadata.rs"
