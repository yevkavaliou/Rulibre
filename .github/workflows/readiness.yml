name: Core readiness
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readiness:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Test core, TUI and native volumes
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force target | Out-Null
          & pwsh -NoProfile -File scripts/check-readiness.ps1 *>&1 | Tee-Object -FilePath target/readiness.log
          if ($LASTEXITCODE -ne 0) { throw 'Readiness checks failed' }
      - name: Save verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-${{ matrix.os }}
          path: target/readiness.log
